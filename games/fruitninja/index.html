		<script>
(function () {
  // vendors.bundle.js is 22.8 MiB so jsDelivr refuses to serve it, and a plain
  // <script src> can't be intercepted by merge.js. Wait for the merged buffer,
  // run it from a blob, then load main.bundle.js so the order is preserved.
  var deadline = Date.now() + 120000;
  function ready() {
    var buf = window.mergedFiles && window.mergedFiles["vendors.bundle.js"];
    if (!buf) {
      if (Date.now() > deadline) {
        console.error("vendors.bundle.js: merge never finished");
        return;
      }
      return setTimeout(ready, 100);
    }
    var vendors = document.createElement("script");
    vendors.src = URL.createObjectURL(new Blob([buf], { type: "application/javascript" }));
    vendors.onload = function () {
      var main = document.createElement("script");
      main.src = "main.bundle.js";
      document.body.appendChild(main);
    };
    document.body.appendChild(vendors);
  }
  ready();
})();
</script>
